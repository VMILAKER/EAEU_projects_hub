services:
  app:
   container_name: eaeu_projects_hub
   command: uvicorn main:app --host 0.0.0.0 --port 8000
   build: 
     context: .
     dockerfile: Dockerfile
   depends_on:
     - db
   volumes:
    # - ./app:/Backend/app
    - /etc/localtime:/etc/localtime:ro
    - /etc/timezone:/etc/timezone:ro
   environment:
      DATABASE_URL: "postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@${DB_CONTAINER_NAME}/${DB_NAME}"
   ports:
    - '8002:8000'
   networks:
    - eaeu-network
   restart: always

  db:
    container_name: "${DB_CONTAINER_NAME}"
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: "${DB_USER}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_DB: "${DB_NAME}"
      TZ: Europe/Moscow
    ports:
     - "${DB_PORT}:5432"
    volumes:
      - ./volume:/var/lib/postgresql/data
    networks:
     - eaeu-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
  
  ollama_eaeu:
    container_name: "${OLLAMA_CONTAINER_NAME}"
    image: ollama/ollama:latest
    environment:
      - OLLAMA_KEEP_ALIVE=0
    platform: linux/amd64
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "${OLLAMA_PORT}:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:11434/api/health"]
    #   interval: 30s
    #   timeout: 15s
    #   retries: 3
    #   start_period: 600s

    restart: unless-stopped
    networks:
      - eaeu-network


volumes:
  ollama_data:

networks:
  eaeu-network:
    name: eaeu-network
    driver: bridge
    ipam:
      config:
        - subnet: 10.89.0.0/24